name: Windows

on: push

jobs:

  build-and-release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - name: Set app version
        shell: bash
        run: |
          echo "APP_VERSION=$(sed -n 's/^  msix_version: //p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'

      - name: Find and Replace NMS FAA
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.dart'
          search-text: '@@__faa_nms_api_client_id_secret__@@'
          replacement-text: ${{ secrets.FAA_NMS_API_CLIENT_ID_SECRET }}
          encoding: 'utf8'
          max-parallelism: 10

      - name: Find and Replace App Check Windows debug token
        uses: richardrigutins/replace-in-files@v2
        with:
          files: '**/*.dart'
          search-text: '@@__app_check_windows_debug_token__@@'
          replacement-text: ${{ secrets.APP_CHECK_WINDOWS_DEBUG_TOKEN }}
          encoding: 'utf8'
          max-parallelism: 10

      - name: Install project dependencies
        run: flutter pub get

      # Node 22.23.0 / 24.17.0 / 26 shipped an http.Agent keep-alive
      # regression that breaks firebase-tools ADC auth (firebase-tools#10716),
      # which makes `flutterfire configure` hang on an interactive prompt.
      # Pin to a fixed Node release.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Login to Firebase
        shell: bash
        run: |
          # Pinned: firebase-tools 15.22.2 has an ADC/service-account auth
          # regression (firebase-tools#10716) that makes `flutterfire
          # configure` hang on an interactive "create project?" prompt.
          # Unpin once a fixed release ships.
          npm install -g firebase-tools@15.22.1
          echo -n ${{ secrets.GOOGLE_SERVICES_KEY }} | base64 -d > key.json
          export GOOGLE_APPLICATION_CREDENTIALS="key.json"
          dart pub global activate flutterfire_cli
          # Windows Git Bash cannot see the pub-cache .bat shim as `flutterfire`.
          # Invoke the CLI through Dart so PATH is not required.
          dart pub global run flutterfire_cli:flutterfire configure \
            --project avarex-479ae --platforms windows --yes < /dev/null

      - name: Build artifacts
        run: flutter build windows --release
      - name: Build artifacts MSIX
        run: dart run msix:create
      - name: Sanitize branch name
        id: ref
        shell: bash
        run: echo "safe=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: ${{ steps.ref.outputs.safe }}-windows.zip
          directory: build/windows/x64/runner/Release
      - name: Prepare upload artifact
        shell: bash
        run: |
          mkdir -p build/artifacts
          cp "build/windows/x64/runner/Release/${{ steps.ref.outputs.safe }}-windows.zip" "build/artifacts/avarex_windows_${APP_VERSION}_${{ steps.ref.outputs.safe }}.zip"
      - name: Windows Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: build/windows/x64/runner/Release/${{ steps.ref.outputs.safe }}-windows.zip
      - name: Upload Artifact
        shell: bash
        run: |
          ASKPASS_SCRIPT="$RUNNER_TEMP/apps4av_ssh_askpass.sh"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$MAMBA_PASSWORD"\n' > "$ASKPASS_SCRIPT"
          chmod 700 "$ASKPASS_SCRIPT"
          export SSH_ASKPASS="$ASKPASS_SCRIPT"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=none
          scp -o StrictHostKeyChecking=accept-new build/artifacts/* apps4av@apps4av.org:/home/apps4av/builds/
        env:
          MAMBA_PASSWORD: ${{ secrets.MAMBA_PASSWORD }}
