buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// AGP 8.13+ rejects plugins compiled against API 34 when they pull
// androidx.core 1.15 (needs compileSdk 35+). Flutter 3.47 uses 36.
subprojects { subproject ->
    def bumpCompileSdk = {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null) {
            androidExt.compileSdkVersion 36
        }
    }
    if (subproject.state.executed) {
        bumpCompileSdk()
    } else {
        subproject.afterEvaluate bumpCompileSdk
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
